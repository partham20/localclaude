name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The real app with a scripted Claude (no account or network needed)
      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: node test/e2e/launch.mjs
        env:
          LOCALCLAUDE_E2E_SHOTS: e2e-shots

      - name: End-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node test/e2e/launch.mjs
        env:
          LOCALCLAUDE_E2E_SHOTS: e2e-shots

      - name: Screenshots from the end-to-end tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shots-${{ matrix.os }}
          path: e2e-shots
          if-no-files-found: ignore

  # Server mode (the self-hosted browser version): the built app with --server, driven by Playwright
  server-mode:
    name: server mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Browser for the test
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium

      - name: Server-mode tests
        run: node test/e2e/web.mjs

  # The Docker image builds and starts (signs in nowhere; just answers its health check)
  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t localclaude:ci .

      - name: Start it and check it answers
        run: |
          docker run -d --name lc --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:8080:8080 \
            -e LOCALCLAUDE_SECRET=ci-only-secret-0123456789 localclaude:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 2; done
          docker logs lc
          exit 1
