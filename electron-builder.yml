appId: com.parthasarathym.localclaude
productName: LocalClaude
copyright: Personal use only
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
  # Only the glibc binary is needed on normal Linux desktops
  - '!node_modules/@anthropic-ai/claude-agent-sdk-linux-*-musl/**'
# The native Claude Code binary must live outside the asar archive to be executable.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
linux:
  target:
    - AppImage
    - deb
    # portable: unpack anywhere and run ./localclaude (no FUSE needed, unlike the AppImage)
    - tar.gz
  # names the tar.gz; the AppImage and .deb keep their own names below
  artifactName: ${productName}-${version}-linux-${arch}-portable.${ext}
  category: Development
  syncDesktopName: true
  icon: build/icon.png
  maintainer: Parthasarathy M <parthasarathym20@gmail.com>
appImage:
  artifactName: ${productName}-${version}.${ext}
deb:
  artifactName: ${name}_${version}_${arch}.${ext}
win:
  target:
    - nsis
    # portable: unzip anywhere and run LocalClaude.exe, nothing installed
    - zip
  icon: build/icon.png
  # names the zip; the installer keeps its own name below
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
nsis:
  # no spaces: GitHub release downloads turn them into dots
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish: null
